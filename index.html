
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Art Gallery</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- BLACK BACKGROUND -->
  <main id="background"></main>

  <!-- SLIDING GALLERY -->
  <div id="galleryDrawer">

    <!-- GALLERY CONTENT -->
    <div id="galleryContent">

      <!-- CATEGORY NAVIGATION -->
      <nav class="nav-links" aria-label="Gallery categories">

        <a href="#" data-page="paintings">Paintings</a>
        <a href="#" data-page="films">Films</a>
        <a href="#" data-page="photography">Photography</a>
        <a href="#" data-page="music">Music</a>
        <a href="#" data-page="books">Books</a>
        <a href="#" data-page="clothing">Clothing</a>
        <a href="#" data-page="other">Other</a>

      </nav>

      <!-- DYNAMIC GALLERY CONTENT -->
      <main id="content"></main>

    </div>

    <!-- WHITE GALLERY TAB -->
    <button
      id="galleryToggle"
      type="button"
      aria-label="Open gallery"
      aria-expanded="false"
      aria-controls="galleryContent"
    >
      <span>Gallery</span>
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
