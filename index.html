
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Art Gallery</title>

  <link rel="stylesheet" href="style.css">

  <!-- 3D LIBRARIES (three.js) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
      }
    }
  </script>
</head>

<body>

  <!-- 3D GALLERY BACKGROUND (stays black while the model loads, or if 3D isn't supported) -->
  <main id="background"></main>

  <!-- SLIDING GALLERY -->
  <div id="galleryDrawer">

    <!-- GALLERY CONTENT -->
    <div id="galleryContent">

      <!-- CATEGORY NAVIGATION -->
      <nav class="nav-links" aria-label="Gallery categories">

        <a href="#" data-page="paintings">Paintings</a>
        <a href="#" data-page="films">Films</a>
        <a href="#" data-page="photography">Photography</a>
        <a href="#" data-page="music">Music</a>
        <a href="#" data-page="books">Books</a>
        <a href="#" data-page="jewelry">Jewelry</a>
        <a href="#" data-page="custom-orders">Custom Orders</a>

      </nav>

      <!-- DYNAMIC GALLERY CONTENT -->
      <main id="content"></main>

    </div>

    <!-- WHITE GALLERY TAB -->
    <button
      id="galleryToggle"
      type="button"
      aria-label="Open gallery"
      aria-expanded="false"
      aria-controls="galleryContent"
    >
      <span>Gallery</span>
    </button>

  </div>

  <script src="script.js"></script>
  <script type="module" src="gallery3d.js"></script>

</body>
</html>
