
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Art Gallery</title>

  <!-- Thin geometric font for the "ExpoStudios" title -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200&display=swap">

  <link rel="stylesheet" href="style.css">

  <!-- 3D LIBRARIES (three.js) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
      }
    }
  </script>
</head>

<body>

  <!-- 3D GALLERY BACKGROUND (stays black while the model loads, or if 3D isn't supported) -->
  <main id="background"></main>

  <!-- Title shown at the top centre when the page first loads (fades once the visitor starts exploring) -->
  <h1 id="siteTitle">ExpoStudios</h1>

  <!-- SLIDING GALLERY -->
  <div id="galleryDrawer">

    <!-- CLOSE BUTTON (circled X, top right of the open gallery) -->
    <button id="galleryClose" type="button" aria-label="Close gallery" tabindex="-1">
      <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M11 11 L21 21 M21 11 L11 21" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- GALLERY CONTENT -->
    <div id="galleryContent">

      <!-- CATEGORY NAVIGATION -->
      <nav class="nav-links" aria-label="Gallery categories">

        <a href="#" data-page="paintings">Paintings</a>
        <a href="#" data-page="murals">Murals</a>
        <a href="#" data-page="liveEvents">Live Painting Events</a>
        <a href="#" data-page="films">Films</a>
        <a href="#" data-page="photography">Photography</a>
        <a href="#" data-page="jewelry">Jewelry</a>
        <a href="#" data-page="custom-orders">Custom Orders</a>

      </nav>

      <!-- DYNAMIC GALLERY CONTENT -->
      <main id="content"></main>

    </div>

    <!-- WHITE GALLERY TAB -->
    <button
      id="galleryToggle"
      type="button"
      aria-label="Open gallery"
      aria-expanded="false"
      aria-controls="galleryContent"
    >
      <span>Gallery</span>
    </button>

  </div>

  <script src="script.js"></script>
  <script type="module" src="gallery3d.js"></script>

</body>
</html>
